<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern OS Simulator Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">OS</div>
          <h2>Simulator</h2>
        </div>

        <div class="sidebar-section">
          <button id="runSimulationBtn" class="btn primary">▶ Run Simulation</button>
          <button id="loadDefaultsBtn" class="btn ghost">↺ Reset</button>
        </div>

        <div class="sidebar-section playback-box">
          <h3 class="section-title">Playback</h3>
          <div class="slider-row">
            <button id="prevStepBtn" class="btn small ghost">◀</button>
            <input id="stepSlider" type="range" min="0" max="0" value="0" />
            <button id="nextStepBtn" class="btn small ghost">▶</button>
          </div>
          <div class="slider-row" style="margin-top: 10px;">
            <button id="autoPlayBtn" class="btn primary small" style="flex:1;">▶ Auto Run</button>
            <input id="clockSpeedInput" type="number" min="100" step="100" value="500" title="Clock Speed (ms)" style="width: 70px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 4px; border-radius: var(--radius-sm); font-family: monospace; font-size: 0.7rem;" />
          </div>
          <p id="snapshotLabel" class="snapshot-label" style="margin-top: 10px;">Ready</p>
        </div>

        <div class="sidebar-section">
          <div style="display: flex; gap: 8px;">
            <label class="field" style="flex: 2;">
              <span>Algorithm</span>
              <select id="schedulerSelect"></select>
            </label>
            <label class="field" style="flex: 1;">
              <span>RR Q</span>
              <input id="rrQuantumInput" type="number" min="1" value="2" />
            </label>
          </div>
          <h3 class="section-title" style="margin-top: 10px;">Processes</h3>
          <div id="processConfigurator" class="process-configurator"></div>
        </div>

        <div class="sidebar-section" style="margin-top: auto; margin-bottom: 0;">
          <h3 class="section-title">Summary</h3>
          <div id="summaryCards" class="summary-cards"></div>
        </div>
      </aside>

      <!-- MAIN AREA -->
      <main class="main-content">
        <!-- TOP BAR -->
        <header class="top-bar">
          <div class="core-status">
            <span id="coreDot" class="dot idle"></span>
            System Core: <strong id="coreLabel">IDLE</strong>
          </div>
        </header>

        <!-- DASHBOARD WORKSPACE -->
        <div class="workspace">
          
          <!-- State Grid: Contains Processes, Queues, Mutexes, Memory -->
          <div id="stateGrid" class="state-grid"></div>

          <!-- Logs Panel -->
          <div class="logs-panel">
            <div class="log-half">
              <div class="panel-header">Output</div>
              <div id="outputList" class="console-list"></div>
            </div>
            <div class="log-half">
              <div class="panel-header">Execution Log</div>
              <div id="timelineList" class="console-list"></div>
            </div>
          </div>

        </div>
      </main>
    </div>

    <!-- Hidden elements -->
    <div style="display: none;">
      <div id="runtimePulse"></div>
      <pre id="apiRequest"></pre>
      <pre id="apiResponse"></pre>
      <div id="errorList"></div>
    </div>

    <!-- Template for Process config -->
    <template id="processTemplate">
      <div class="process-item">
        <div class="process-header">
          <h3></h3>
          <span class="program-file"></span>
        </div>
        <div class="process-inputs">
          <input class="arrival-input" type="number" placeholder="Arr" title="Arrival Time" />
          <input class="input-map" type="text" placeholder="{}" title="Input Map (JSON)" />
        </div>
      </div>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
